<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="ApexPOS logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feFlood flood-color="#06b6d4" flood-opacity="0.45" />
      <feComposite in2="blur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="44" height="44" rx="12" fill="#083344" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)" />

  <!-- Zap bolt, scaled from the 24x24 lucide icon to 22x22 and centred -->
  <g transform="translate(21 21) scale(0.9167)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
